services:
  postgres:
    image: postgres:16-alpine
    container_name: tracelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracelab
      POSTGRES_USER: tracelab
      POSTGRES_PASSWORD: tracelab_dev_password
    ports:
      - "5432:5432"
    volumes:
      - tracelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelab -d tracelab"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  tracelab_pgdata:
