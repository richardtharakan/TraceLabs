plugins {
    id 'com.android.application'
}

// Read the API URL from the root android/gradle.properties file.
// This avoids manually loading java.util.Properties in the Gradle script.
def configuredApiBaseUrl = providers.gradleProperty('tracelabApiBaseUrl')
        .getOrElse('http://10.0.2.2:3000')

android {
    namespace 'com.tracelab.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tracelab.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', '\"' + configuredApiBaseUrl.replace('"', '\\"') + '\"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
